server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /r/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /c/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
