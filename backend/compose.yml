services:
  backend:
    build: .
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready',timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
  frontend:
    build: ../frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  admin:
    build: ../admin
    ports: ["8081:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
