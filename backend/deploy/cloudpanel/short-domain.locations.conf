# Merge inside the server block for the configured PUBLIC_BASE_URL hostname.
# Use this when the public short-link/profile domain is separate from the React app.
# Preserve CloudPanel TLS, hostname, root, logging, and ACME directives.
client_max_body_size 2m;
location ^~ /r/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
}
location ^~ /c/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
}
location / { return 404; }
