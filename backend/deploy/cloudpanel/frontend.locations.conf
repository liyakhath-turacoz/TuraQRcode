# Merge inside the customer's existing CloudPanel application server block.
# Preserve CloudPanel TLS, hostname, root, logging, and ACME directives.
client_max_body_size 3m;
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_no_cache 1;
}
location ^~ /r/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
}
location ^~ /c/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
}
location ^~ /assets/ { expires 1y; try_files $uri =404; }
location = /index.html { expires -1; }
location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
location / { try_files $uri $uri/ /index.html; }
